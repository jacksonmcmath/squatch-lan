services:
  traefik-reverse-proxy:
    image: traefik:v3
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    command:
      - --configFile=/config/traefik.yaml
    depends_on:
      socket-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # networks:
    #   - private-traefik
    #   - public-traefik
    #   - public-dockhand
    ports:
      - 80:80
      - 443:443
    environment:
      TZ: America/New_York
      CLOUDFLARE_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
      CLOUDFLARE_ZONE_API_TOKEN: ${CF_ZONE_API_TOKEN}
    volumes:
      - ./config:/etc/traefik
      - /var/log/traefik:/var/log/traefik
    # labels:
    #   traefik.enable: true
    #   traefik.docker.network: public-traefik
    #   traefik.http.routers.dashboard.rule: Host(`ingress.***.squ4tch.net`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))
    #   traefik.http.routers.dashboard.entrypoints: websecure
    #   traefik.http.routers.dashboard.tls: true
    #   traefik.http.routers.dashboard.tls.certresolver: le
    #   traefik.http.routers.dashboard.service: api@internal
    #   traefik.http.routers.dashboard.middlewares: authentik@file
    user: 1000:1000
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: 1.0
          memory: 256M
          pids: 32
        reservations:
          cpus: 0.05
          memory: 64M
  
  docker-socket-proxy:
    extends:
      file: ../socket-proxy/compose.yaml
      service: socket-proxy
    networks:
      - private-traefik
    environment:
      TZ: America/New_York
      EVENTS: 1
      PING: 1
      VERSION: 1
      CONTAINERS: 1
