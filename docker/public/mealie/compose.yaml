name: mealie

services:
  server:
    image: ghcr.io/mealie-recipes/mealie:latest
    restart: unless-stopped
    init: true
    depends_on:
      - database
    networks:
      - private-mealie
      - public-mealie
    expose:
      - 9000
    environment:
      # Light mode colors
      THEME_LIGHT_PRIMARY: "#5E9BD1"
      THEME_LIGHT_ACCENT: "#A3C9E8"
      THEME_LIGHT_SECONDARY: "#4F89BA"
      THEME_LIGHT_SUCCESS: "#4CAF50"
      THEME_LIGHT_INFO: "#4A9ED8"
      THEME_LIGHT_WARNING: "#EAC46B"
      THEME_LIGHT_ERROR: "#E57373"
      # Dark mode colors
      THEME_DARK_PRIMARY: "#5A8FBF"
      THEME_DARK_ACCENT: "#90B8D9"
      THEME_DARK_SECONDARY: "#406D96"
      THEME_DARK_SUCCESS: "#81C784"
      THEME_DARK_INFO: "#78B2C0"
      THEME_DARK_WARNING: "#EBC86E"
      THEME_DARK_ERROR: "#E57373"
    env_file:
      - .env
    volumes:
      - mealie-data:/app/data/
    labels:
      traefik.enable: true
      traefik.docker.network: public-mealie
      traefik.http.routers.mealie.rule: Host(`recipes.squ4tch.net`) || Host(`recipes.squatch.dev`)
      traefik.http.routers.mealie.entrypoints: websecure
      traefik.http.routers.mealie.tls: true
      traefik.http.routers.mealie.tls.certresolver: le
      traefik.http.services.mealie.loadbalancer.server.port: 9000
    user: 1000:1000
    read_only: true
    tmpfs:
      - /run:rw,noexec,nosuid,nodev,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: 1.0
          memory: 1G
          pids: 128
        reservations:
          cpus: 0.10
          memory: 256M

  database:
    extends:
      file: ../../base/postgres/compose.yaml
      service: postgres
    networks:
      - private-mealie

networks:
  private-mealie:
    name: private-mealie
    internal: true
  public-mealie:
    name: public-mealie
    external: true
