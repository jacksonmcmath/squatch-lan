name: sparky-fitness

services:
  server:
    image: codewithcj/sparkyfitness_server:latest
    restart: unless-stopped
    init: true
    depends_on:
      - database
    networks:
      - private-sparky-fitness
    expose:
      - 3010
    environment:
      TZ: America/New_York
      SPARKY_FITNESS_LOG_LEVEL: TRACE
      SPARKY_FITNESS_DB_USER: ${PG_USERNAME}
      SPARKY_FITNESS_DB_PASSWORD: ${PG_PASSWORD}
      SPARKY_FITNESS_DB_HOST: database
      SPARKY_FITNESS_DB_PORT: 5432
      SPARKY_FITNESS_DB_NAME: ${PG_DATABASE}
      SPARKY_FITNESS_APP_DB_USER: ${APP_DB_USERNAME}
      SPARKY_FITNESS_APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      SPARKY_FITNESS_API_ENCRYPTION_KEY: ${API_ENCRYPTION_KEY}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      SPARKY_FITNESS_SERVER_HOST: server
      SPARKY_FITNESS_FRONTEND_URL: http://localhost:8080 # https://fitness.squatch.dev
      SPARKY_FITNESS_EXTRA_TRUSTED_ORIGINS: http://localhost:8080,https://fitness.squatch.dev,https://auth.squatch.dev,https://mcp.fitness.squ4tch.net
      SPARKY_FITNESS_PUBLIC_API_DOCS: true
      SPARKY_FITNESS_EMAIL_HOST: mail.smtp2go.com
      SPARKY_FITNESS_EMAIL_PORT: 2525
      SPARKY_FITNESS_EMAIL_SECURE: true
      SPARKY_FITNESS_EMAIL_USER: ${SMTP_USERNAME}
      SPARKY_FITNESS_EMAIL_PASS: ${SMTP_PASSWORD}
      SPARKY_FITNESS_EMAIL_FROM: fitness@squatch.dev
      SPARKY_FITNESS_DISABLE_EMAIL_LOGIN: true
      SPARKY_FITNESS_OIDC_AUTH_ENABLED: true
      SPARKY_FITNESS_OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      SPARKY_FITNESS_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      SPARKY_FITNESS_OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      SPARKY_FITNESS_OIDC_PROVIDER_SLUG: authentik
      SPARKY_FITNESS_OIDC_PROVIDER_NAME: Authentik
      SPARKY_FITNESS_OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP}
      SPARKY_FITNESS_MCP_URL: http://mcp-server:3001
      PUID: 1000
      GUID: 1000
    volumes:
      - ./backup:/app/SparkyFitnessServer/backup
      - ./uploads:/app/SparkyFitnessServer/uploads
    user: 1000:1000
    read_only: true
    tmpfs:
      - /run:rw,noexec,nosuid,nodev,size=128m
      - /tmp:rw,noexec,nosuid,nodev,size=128m
      - /app/SparkyFitnessServer/temp_uploads:rw,noexec,nosuid,nodev,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: 1.0
          memory: 512M
          pids: 128
        reservations:
          cpus: 0.10
          memory: 128M

  frontend:
    image: codewithcj/sparkyfitness:latest
    restart: unless-stopped
    init: true
    depends_on:
      - server
    networks:
      - private-sparky-fitness
      - public-sparky-fitness
    expose:
      - 80
    ports:
      - 8080:80
    environment:
      TZ: America/New_York
      PUID: 1000
      GUID: 1000
      SPARKY_FITNESS_FRONTEND_URL: http://localhost:8080 # https://fitness.squatch.dev
      SPARKY_FITNESS_SERVER_HOST: server
      SPARKY_FITNESS_SERVER_PORT: 3010
    labels:
      traefik.enable: true
      traefik.docker.network: public-sparky-fitness
      traefik.http.routers.sparky-fitness.rule: Host(`fitness.squ4tch.net`) || Host(`fitness.squatch.dev`)
      traefik.http.routers.sparky-fitness.entrypoints: websecure
      traefik.http.routers.sparky-fitness.tls: true
      traefik.http.routers.sparky-fitness.tls.certresolver: le
      traefik.http.services.sparky-fitness.loadbalancer.server.port: 80
    # user: 1000:1000
    # read_only: true
    # tmpfs:
    #   - /run:rw,noexec,nosuid,nodev,size=128m
    #   - /etc/nginx:rw,noexec,nosuid,nodev,uid=1000,gid=1000,size=128m
    #   - /var/run/nginx:rw,noexec,nosuid,nodev,uid=1000,gid=1000,size=128m
    #   - /var/cache/nginx:rw,noexec,nosuid,nodev,uid=1000,gid=1000,size=128m
    # cap_drop:
    #   - ALL
    # security_opt:
    #   - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 256M
          pids: 64
        reservations:
          cpus: 0.05
          memory: 64M

  mcp-server:
    image: codewithcj/sparkyfitness_mcp:latest
    restart: unless-stopped
    init: true
    depends_on:
      - database
    networks:
      - private-sparky-fitness
      - public-sparky-fitness
    expose:
      - 3001
    environment:
      TZ: America/New_York
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      SPARKY_FITNESS_DB_USER: ${PG_USERNAME}
      SPARKY_FITNESS_DB_PASSWORD: ${PG_PASSWORD}
      SPARKY_FITNESS_DB_HOST: database
      SPARKY_FITNESS_DB_PORT: 5432
      SPARKY_FITNESS_DB_NAME: ${PG_DATABASE}
      SPARKY_FITNESS_APP_DB_USER: ${APP_DB_USERNAME}
      SPARKY_FITNESS_APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      MCP_TRANSPORT: http
      SPARKY_FITNESS_SERVER_HOST: server
      SPARKY_FITNESS_SERVER_PORT: 3010
      SPARKY_FITNESS_FRONTEND_URL: http://localhost:8080 # https://fitness.squatch.dev
      ALLOW_PRIVATE_NETWORK_CORS: false
      SPARKY_FITNESS_EXTRA_TRUSTED_ORIGINS: http://localhost:8080,https://fitness.squatch.dev,https://auth.squatch.dev,https://mcp.fitness.squ4tch.net
    labels:
      traefik.enable: true
      traefik.docker.network: public-sparky-fitness
      traefik.http.routers.sparky-fitness-mcp.rule: Host(`mcp.fitness.squ4tch.net`)
      traefik.http.routers.sparky-fitness-mcp.entrypoints: websecure
      traefik.http.routers.sparky-fitness-mcp.tls: true
      traefik.http.routers.sparky-fitness-mcp.tls.certresolver: le
      traefik.http.services.sparky-fitness-mcp.loadbalancer.server.port: 3001
    user: 1000:1000
    read_only: true
    tmpfs:
      - /run:rw,noexec,nosuid,nodev,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: 0.5
          memory: 256M
          pids: 64
        reservations:
          cpus: 0.05
          memory: 64M

  database:
    extends:
      file: ../../base/postgres/compose.yaml
      service: postgres
    networks:
      - private-sparky-fitness
    environment:
      POSTGRES_USER: ${PG_USERNAME}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DATABASE}
      SPARKY_FITNESS_APP_DB_USER: ${APP_DB_USERNAME}
      SPARKY_FITNESS_APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - database-data:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro

networks:
  private-sparky-fitness:
    name: private-sparky-fitness
    internal: true
  public-sparky-fitness:
    name: public-sparky-fitness
    external: true

volumes:
  database-data:
