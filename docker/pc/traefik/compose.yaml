services:
  reverse-proxy:
    extends:
      file: ../../base/traefik/compose.yaml
      service: traefik-reverse-proxy
    networks:
      - private-traefik
      - public-traefik
      - public-dockhand
      - public-ollama
    labels:
      traefik.enable: true
      traefik.docker.network: public-traefik
      traefik.http.routers.dashboard.rule: Host(`ingress.pc.squ4tch.net`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))
      traefik.http.routers.dashboard.entrypoints: websecure
      traefik.http.routers.dashboard.tls: true
      traefik.http.routers.dashboard.tls.certresolver: le
      traefik.http.routers.dashboard.service: api@internal
      traefik.http.routers.dashboard.middlewares: authentik@file
  
  socket-proxy:
    extends:
      file: ../../base/traefik/compose.yaml
      service: docker-socket-proxy

networks:
  private-traefik:
    name: private-traefik
    internal: true
  public-traefik:
    name: public-traefik
  public-dockhand:
    name: public-dockhand
  public-ollama:
    name: public-ollama
