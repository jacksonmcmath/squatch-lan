name: servarr-processing

services:
  tdarr:
    image: ghcr.io/haveagitgat/tdarr:latest
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    networks:
      - public-tdarr
    expose:
      - 8265 # Web UI
      - 8266 # Server
    environment:
      TZ: America/New_York
      PUID: 100900
      PGID: 100900
      UMASK: 002
      nodeName: server
      auth: true
      openBrowser: false
    volumes:
      - ./tdarr:/app
      - /mnt/servarr/media:/servarr/media
    labels:
      traefik.enable: true
      traefik.docker.network: public-tdarr
      traefik.http.routers.tdarr.rule: Host(`transcode.servarr.squ4tch.net`)
      traefik.http.routers.tdarr.entrypoints: websecure
      traefik.http.routers.tdarr.tls: true
      traefik.http.routers.tdarr.tls.certresolver: le
      traefik.http.services.tdarr.loadbalancer.server.port: 8265
    user: 100900:100900
    read_only: true
    tmpfs:
      - /temp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: 0.50
          memory: 256M
          pids: 128
        reservations:
          cpus: 0.10
          memory: 64M

networks:
  public-tdarr:
    name: public-tdarr
    external: true
