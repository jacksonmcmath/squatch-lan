services:
  prowlarr:
    image: ghcr.io/hotio/prowlarr:latest
    restart: unless-stopped
    stop_grace_period: 15s
    networks:
      - private-prowlarr
      - public-prowlarr
    expose:
      - 9696
    environment:
      PUID: 100910
      PGID: 100900
      UMASK: 002
      TZ: America/New_York
      WEBUI_PORTS: 9696/tcp,9696/udp
    volumes:
      - ./prowlarr:/config
    labels:
      traefik.enable: true
      traefik.docker.network: public-prowlarr
      traefik.http.routers.prowlarr.rule: Host(`indexers.servarr.squ4tch.net`) && PathPrefix(`/prowlarr`)
      traefik.http.routers.prowlarr.entrypoints: websecure
      traefik.http.routers.prowlarr.tls: true
      traefik.http.routers.prowlarr.tls.certresolver: le
      traefik.http.services.prowlarr.loadbalancer.server.port: 9696
    deploy:
      resources:
        limits:
          cpus: 2.0
          memory: 1G
          pids: 256
        reservations:
          cpus: 0.2
          memory: 128M

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    restart: unless-stopped
    networks:
      - private-prowlarr
      - public-flaresolverr
    expose:
      - 8191
    environment:
      PUID: 100910
      PGID: 100900
      UMASK: 002
      TZ: America/New_York
    volumes:
      - ./flaresolverr:/config
    deploy:
      resources:
        limits:
          cpus: 2.0
          memory: 1G
          pids: 256
        reservations:
          cpus: 0.2
          memory: 128M

  radarr:
    image: ghcr.io/hotio/radarr:latest
    restart: unless-stopped
    networks:
      - private-prowlarr
      - private-qbittorrent
      - private-sabnzbd
      - public-radarr
    expose:
      - 7878
    environment:
      PUID: 100911
      PGID: 100900
      UMASK: 002
      TZ: America/New_York
    volumes:
      - ./radarr:/config
      - /mnt/servarr:/servarr
    labels:
      traefik.enable: true
      traefik.docker.network: public-radarr
      traefik.http.routers.radarr.rule: Host(`movies.servarr.squ4tch.net`)
      traefik.http.routers.radarr.entrypoints: websecure
      traefik.http.routers.radarr.tls: true
      traefik.http.routers.radarr.tls.certresolver: le
      traefik.http.services.radarr.loadbalancer.server.port: 7878
    deploy:
      resources:
        limits:
          cpus: 2.0
          memory: 1G
          pids: 256
        reservations:
          cpus: 0.2
          memory: 128M

  sonarr:
    image: ghcr.io/hotio/sonarr:latest
    restart: unless-stopped
    networks:
      - private-prowlarr
      - private-qbittorrent
      - private-sabnzbd
      - public-sonarr
    expose:
      - 8989
    environment:
      PUID: 100912
      PGID: 100900
      UMASK: 002
      TZ: America/New_York
    volumes:
      - ./sonarr:/config
      - /mnt/servarr:/servarr
    labels:
      traefik.enable: true
      traefik.docker.network: public-sonarr
      traefik.http.routers.sonarr.rule: Host(`shows.servarr.squ4tch.net`)
      traefik.http.routers.sonarr.entrypoints: websecure
      traefik.http.routers.sonarr.tls: true
      traefik.http.routers.sonarr.tls.certresolver: le
      traefik.http.services.sonarr.loadbalancer.server.port: 8989
    deploy:
      resources:
        limits:
          cpus: 2.0
          memory: 1G
          pids: 256
        reservations:
          cpus: 0.2
          memory: 128M

  lidarr:
    image: ghcr.io/hotio/lidarr:latest
    restart: unless-stopped
    networks:
      - private-prowlarr
      - private-qbittorrent
      - private-sabnzbd
      - public-lidarr
    expose:
      - 8686
    environment:
      PUID: 100913
      PGID: 100900
      UMASK: 002
      TZ: America/New_York
    volumes:
      - ./lidarr:/config
      - /mnt/servarr:/servarr
    labels:
      traefik.enable: true
      traefik.docker.network: public-lidarr
      traefik.http.routers.lidarr.rule: Host(`music.servarr.squ4tch.net`)
      traefik.http.routers.lidarr.entrypoints: websecure
      traefik.http.routers.lidarr.tls: true
      traefik.http.routers.lidarr.tls.certresolver: le
      traefik.http.services.lidarr.loadbalancer.server.port: 8686
    deploy:
      resources:
        limits:
          cpus: 2.0
          memory: 1G
          pids: 256
        reservations:
          cpus: 0.2
          memory: 128M

  bazarr:
    image: ghcr.io/hotio/bazarr:latest
    restart: unless-stopped
    networks:
      - public-bazarr
    expose:
      - 6767
    environment:
      PUID: 100919
      PGID: 100900
      UMASK: 002
      TZ: America/New_York
    volumes:
      - ./bazarr:/config
      - /mnt/servarr/media:/servarr/media
    labels:
      traefik.enable: true
      traefik.docker.network: public-bazarr
      traefik.http.routers.bazarr.rule: Host(`subtitles.servarr.squ4tch.net`)
      traefik.http.routers.bazarr.entrypoints: websecure
      traefik.http.routers.bazarr.tls: true
      traefik.http.routers.bazarr.tls.certresolver: le
      traefik.http.services.bazarr.loadbalancer.server.port: 6767
    deploy:
      resources:
        limits:
          cpus: 2.0
          memory: 1G
          pids: 256
        reservations:
          cpus: 0.2
          memory: 128M

networks:
  private-prowlarr:
    name: private-prowlarr
    driver: bridge
    internal: true
  public-prowlarr:
    name: public-prowlarr
    external: true
  public-flaresolverr:
    name: public-flaresolverr
    driver: bridge
  public-radarr:
    name: public-radarr
    external: true
  public-sonarr:
    name: public-sonarr
    external: true
  public-lidarr:
    name: public-lidarr
    external: true
  public-readarr:
    name: public-readarr
    external: true
  public-bazarr:
    name: public-bazarr
    external: true

  private-qbittorrent:
    name: private-qbittorrent
    external: true
  private-sabnzbd:
    name: private-sabnzbd
    external: true
